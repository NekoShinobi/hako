[package]
name = "hako"
version = "0.2.0"
edition = "2024"

[dependencies]
actix-web = "4.14.0"
actix-multipart = "0.8.0"
actix-files = "0.6.10"
actix-cors = "0.7.1"
tokio = { version = "1.53.1", features = ["full"] }
sea-orm = { version = "2.0.1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
hmac = "0.13.0"
aes-gcm = "0.11.0"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
hex = "0.4.3"
env_logger = "0.11.11"
log = "0.4.33"
futures = "0.3.33"
rand = "0.10.2"
tempfile = "3.27.0"
sanitize-filename = "0.6"
once_cell = "1.21.4"
regex = "1.12.3"
num_cpus = "1.17.0"

[dependencies.sea-orm-migration]
version = "2.0.1"
features = ["sqlx-sqlite", "runtime-tokio-rustls"]
