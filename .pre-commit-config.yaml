
repos:
  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.13.0
    hooks:
    - id: pretty-format-rust
      args: [--autofix]

  - repo: https://github.com/rockmagma02/rust-pre-commit-hooks
    rev: v0.2.0
    hooks:
      - id: rustfmt
        args: [--edition=2024]
      - id: cargo-fmt
      - id: clippy